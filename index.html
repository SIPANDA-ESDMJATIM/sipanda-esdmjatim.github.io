<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e305d">
<title>SIPANDA · Nomor Surat Pengadaan</title>
<link rel="icon" href="aset/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="aset/favicon-32.png">
<link rel="apple-touch-icon" href="aset/apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;background:#0b1a2e}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:1}
  #muat{position:fixed;inset:0;z-index:2;display:grid;place-items:center;text-align:center;padding:16px;color:#e8eef7;
    font:16px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#061a35,#0e305d 55%,#1b4a86);transition:opacity .35s}
  #muat.selesai{opacity:0;pointer-events:none}
  #muat img{width:96px;height:96px;border-radius:24px;background:#fff;padding:8px;box-sizing:border-box}
  #muat h1{margin:14px 0 4px;font-size:28px}
  #muat h1 em{font-style:normal;color:#fb841f}
  #muat p{margin:6px 0 0;color:#b9c6da}
  .putar{width:22px;height:22px;margin:16px auto 0;border-radius:50%;border:3px solid #fb841f;border-top-color:transparent;animation:p .8s linear infinite}
  @keyframes p{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.putar{animation:none}}
  #lama a{color:#fb841f;font-weight:600}
</style>
</head>
<body>
<div id="muat" role="status" aria-live="polite">
  <div>
    <img src="aset/icon-192.png" alt="Logo SIPANDA" width="96" height="96">
    <h1>SI<em>PANDA</em></h1>
    <p>Memuat aplikasi&hellip;</p>
    <div class="putar" aria-hidden="true"></div>
    <p id="lama" hidden>Server sedang dibangunkan, mohon tunggu sebentar.<br>Jika terlalu lama, <a href="https://script.google.com/macros/s/AKfycbxh74aLt99slHYrKZnPlfSUthafLQvckEisJbZv2W5szhM6Z1KDdrniWj4ZuE2eMPa4/exec" target="_blank" rel="noopener">buka di tab baru</a>.</p>
  </div>
</div>
<iframe id="app" src="https://script.google.com/macros/s/AKfycbxh74aLt99slHYrKZnPlfSUthafLQvckEisJbZv2W5szhM6Z1KDdrniWj4ZuE2eMPa4/exec" title="SIPANDA" allow="clipboard-write" referrerpolicy="no-referrer"></iframe>
<noscript><p style="position:fixed;z-index:3;inset:auto 0 0;margin:0;padding:12px;background:#fff;color:#000;text-align:center">Aplikasi membutuhkan JavaScript. <a href="https://script.google.com/macros/s/AKfycbxh74aLt99slHYrKZnPlfSUthafLQvckEisJbZv2W5szhM6Z1KDdrniWj4ZuE2eMPa4/exec">Buka langsung</a>.</p></noscript>
<script>
  var f = document.getElementById('app'), m = document.getElementById('muat');
  f.addEventListener('load', function () { m.classList.add('selesai'); });
  setTimeout(function () { document.getElementById('lama').hidden = false; }, 8000);
</script>
</body>
</html>
