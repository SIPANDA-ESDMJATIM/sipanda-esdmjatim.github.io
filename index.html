<title>SIPANDA · Nomor Surat Pengadaan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3f5f9;--card:#fff;--field:#f6f8fb;--ink:#0c1a2e;--mut:#586a82;--line:#e1e7ef;
    --pri:#0e305d;--pri2:#1b4a86;--pri-ink:#fff;--ring:rgba(14,48,93,.25);--accent:#fb841f;
    --ok:#0e305d;--okbg:#e7edf6;--warn:#8a4b00;--warnbg:#fff0e0;--err:#b42318;--errbg:#fdecea;--bar:#dfe6f0;
    --shadow:0 1px 2px rgba(14,48,93,.05),0 10px 30px -14px rgba(14,48,93,.25);
    --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#07111f;--card:#0e1c31;--field:#0a1727;--ink:#e8eef7;--mut:#9bacc4;--line:#1f3250;
    --pri:#fb841f;--pri2:#ffa24d;--pri-ink:#1a0e00;--ring:rgba(251,132,31,.32);
    --ok:#9dbdea;--okbg:#12284a;--warn:#ffb86b;--warnbg:#33200a;--err:#ff8a80;--errbg:#3a1714;--bar:#1f3250;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -14px rgba(0,0,0,.6);
  }}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--font);min-height:100vh}
  svg{flex:none}

  /* ---------- hero ---------- */
  .hero{position:relative;overflow:hidden;color:#fff;background:
    radial-gradient(600px 260px at 88% -10%,rgba(251,132,31,.42),transparent 70%),
    linear-gradient(135deg,#061a35 0%,#0e305d 55%,#1b4a86 100%)}
  .hero .wrap{position:relative;max-width:960px;margin:0 auto;padding:34px 16px 62px}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
    padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(4px)}
  .eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(251,132,31,.35)}
  .hero h1{margin:14px 0 6px;font-size:clamp(28px,5.4vw,42px);line-height:1.1;font-weight:800;letter-spacing:-.02em}
  .hero h1 em{font-style:normal;color:var(--accent)}
  .hero .sub{margin:0;max-width:520px;font-size:15.5px;opacity:.92}
  .brand{display:flex;align-items:center;gap:16px;margin:14px 0 8px}
  .brand .logo{flex:none;width:76px;height:76px;border-radius:22px;background:#fff;display:grid;place-items:center;box-shadow:0 12px 28px -10px rgba(0,0,0,.5);animation:pop .5s cubic-bezier(.3,1.5,.5,1) both}
  .brand .logo img{width:58px;height:58px;display:block}
  .brand h1{margin:0}
  .brand .lengkap{margin:3px 0 0;font-size:13.5px;font-weight:600;opacity:.9;letter-spacing:.01em}
  .who .badge{margin-left:2px}

  /* ---------- dock (menu) ---------- */
  .dock{position:relative;z-index:6;margin-top:-28px}
  .dock .wrap{max-width:960px;margin:0 auto;padding:0 16px}
  #tabs{display:flex;gap:6px;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow-x:auto}
  #tabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border:0;background:none;color:var(--mut);
    padding:11px 14px;border-radius:13px;font:600 14px var(--font);cursor:pointer;white-space:nowrap;transition:background .2s,color .2s,transform .15s}
  #tabs button:hover{color:var(--ink);background:var(--field)}
  #tabs button.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:var(--pri-ink);box-shadow:0 6px 16px -6px var(--ring)}
  #tabs button:active{transform:scale(.97)}

  main{max-width:960px;margin:0 auto;padding:18px 16px 40px}
  main>*{animation:masuk .4s cubic-bezier(.2,.7,.3,1) both}
  main>*:nth-child(2){animation-delay:.05s}main>*:nth-child(3){animation-delay:.1s}
  @keyframes masuk{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  footer{max-width:960px;margin:0 auto;padding:0 16px 28px;color:var(--mut);font-size:12.5px;text-align:center}

  /* ---------- kartu & judul ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
  .card-h{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .card-h h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
  .card-h .hint{margin:2px 0 0;font-size:13px;color:var(--mut)}
  .step{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:14px;
    color:var(--pri-ink);background:linear-gradient(135deg,var(--pri),var(--pri2));box-shadow:0 6px 14px -6px var(--ring)}
  .ico{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--okbg);color:var(--ok)}
  h2{font-size:17px;margin:0 0 12px}
  .mut{color:var(--mut);font-size:13px}
  p.mut{margin:0 0 12px}

  /* ---------- formulir ---------- */
  label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-bottom:5px}
  input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 12px;transition:border-color .15s,box-shadow .15s,background .15s}
  input::placeholder,textarea::placeholder{color:color-mix(in srgb,var(--mut) 70%,transparent)}
  input:hover,select:hover{border-color:color-mix(in srgb,var(--pri) 35%,var(--line))}
  input:focus,select:focus,textarea:focus,.tglbtn:focus-visible{outline:none;border-color:var(--pri);box-shadow:0 0 0 4px var(--ring);background:var(--card)}
  input[readonly]{cursor:default}
  .three{display:grid;grid-template-columns:1fr 1.8fr 1fr;gap:12px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .namawrap{position:relative}
  .namawrap input{padding-left:50px}
  .avatar{position:absolute;left:8px;top:50%;transform:translateY(-50%) scale(.6);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
    font-size:12px;font-weight:800;color:#fff;background:linear-gradient(135deg,#0e305d,#1b4a86);opacity:0;transition:opacity .25s,transform .3s cubic-bezier(.3,1.4,.5,1)}
  .avatar.on{opacity:1;transform:translateY(-50%) scale(1)}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px}
  .chip.ok{background:var(--okbg);color:var(--ok)}
  .chip.err{background:var(--errbg);color:var(--err)}
  .chip.cek{background:var(--field);color:var(--mut)}
  .chip.cek::before{content:"";width:11px;height:11px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--pri);animation:putar .7s linear infinite}
  @keyframes putar{to{transform:rotate(360deg)}}
  #nipInfo{margin-top:10px;min-height:26px;font-size:13px;color:var(--mut)}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}

  /* ---------- baris permintaan ---------- */
  .row{display:grid;grid-template-columns:215px 1.2fr 74px 2fr 36px;gap:8px;align-items:end;margin-bottom:10px}
  .row.lanjut{border-left:3px solid var(--pri);padding-left:8px;margin-left:-11px;border-radius:2px}
  .row input,.row select,.row .tglbtn,.row .plus{height:44px}
  .row .lbl{display:none}
  .row.head{position:sticky;top:0;z-index:5;background:var(--card);margin:0 0 10px;padding:8px 0;border-bottom:1px solid var(--line);
    font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);align-items:center}
  .row.head .h-tgl{padding-left:44px}
  @media (max-width:720px){
    .row{grid-template-columns:1fr 88px;grid-template-areas:"tgl hapus" "jenis jml" "ket ket";row-gap:10px;padding-bottom:14px;border-bottom:1px dashed var(--line)}
    .row>:nth-child(1){grid-area:tgl}.row>:nth-child(2){grid-area:jenis}.row>:nth-child(3){grid-area:jml}
    .row>:nth-child(4){grid-area:ket}.row>:nth-child(5){grid-area:hapus;justify-self:end}
    .row .lbl{display:block}.row.head{display:none}
    .row.lanjut{margin-left:-3px}
  }
  .tglwrap{display:flex;gap:6px;align-items:stretch}
  .tglbtn{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:6px;font:inherit;color:var(--ink);background:var(--field);
    border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;white-space:nowrap;transition:border-color .15s,box-shadow .15s}
  .tglbtn:hover{border-color:color-mix(in srgb,var(--pri) 35%,var(--line))}
  .tglbtn svg{opacity:.65}
  .plus{flex:none;width:40px;border:1px dashed color-mix(in srgb,var(--pri) 55%,var(--line));background:var(--okbg);color:var(--pri);border-radius:12px;
    font-size:22px;line-height:1;cursor:pointer;padding:0;transition:transform .15s,background .15s}
  .plus:hover{background:var(--pri);color:var(--pri-ink);transform:rotate(90deg)}

  /* ---------- tombol ---------- */
  button.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 14px var(--font);border:1px solid var(--line);background:var(--card);color:var(--ink);
    padding:10px 18px;border-radius:12px;cursor:pointer;transition:transform .15s,box-shadow .2s,background .15s}
  button.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px -8px rgba(14,48,93,.3)}
  button.btn:active{transform:translateY(0) scale(.98)}
  button.pri{background:linear-gradient(135deg,var(--pri),var(--pri2));color:var(--pri-ink);border-color:transparent;box-shadow:0 8px 18px -8px var(--ring)}
  button.pri:hover{box-shadow:0 12px 22px -8px var(--ring)}
  button.sm{padding:6px 12px;font-size:13px;border-radius:10px}
  button.ghost{border:0;background:none;color:var(--mut);cursor:pointer;font-size:20px;line-height:1;padding:8px;border-radius:10px}
  button.ghost:hover{background:var(--errbg);color:var(--err)}
  button:disabled{opacity:.45;cursor:not-allowed;transform:none!important;box-shadow:none!important}
  button:focus-visible{outline:none;box-shadow:0 0 0 4px var(--ring)}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;align-items:center}

  /* ---------- pesan ---------- */
  .msg{padding:12px 14px;border-radius:14px;margin-bottom:14px;font-size:14px;font-weight:500}
  .msg.err{background:var(--errbg);color:var(--err)}
  .msg.ok{background:var(--okbg);color:var(--ok)}
  .msg.warn{background:var(--warnbg);color:var(--warn)}
  .badge{display:inline-block;font-size:11.5px;padding:3px 9px;border-radius:999px;background:var(--okbg);color:var(--ok);font-weight:700}
  .badge.warn{background:var(--warnbg);color:var(--warn)}
  .pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
  .pill.st-Terpakai{background:var(--okbg);color:var(--ok)}
  .pill.st-Batal{background:var(--errbg);color:var(--err)}

  /* ---------- tabel ---------- */
  .tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:11.5px;color:var(--mut);font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--field);white-space:nowrap}
  tr:last-child td{border-bottom:0}
  tbody tr:hover td{background:color-mix(in srgb,var(--okbg) 45%,transparent)}
  td b{font-weight:800}

  /* ---------- tiket hasil ---------- */
  .sukses{display:flex;align-items:center;gap:16px;margin-bottom:14px}
  .sukses h2{margin:0 0 2px;font-size:20px;font-weight:800;letter-spacing:-.01em}
  .sukses .mut{margin:0}
  .cek-lingkar{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#0e305d,#1b4a86);
    box-shadow:0 10px 22px -8px var(--ring);animation:pop .5s cubic-bezier(.3,1.5,.5,1) both}
  .cek-lingkar path{stroke-dasharray:30;stroke-dashoffset:30;animation:garis .5s .25s ease forwards}
  @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
  @keyframes garis{to{stroke-dashoffset:0}}
  .hasil{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  .tiket{position:relative;display:flex;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);animation:masuk .45s cubic-bezier(.2,.7,.3,1) both}
  .tiket .stub{flex:none;width:108px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#fff;
    background:linear-gradient(160deg,#0e305d,#1b4a86);border-right:2px dashed rgba(251,132,31,.9)}
  .tiket .stub small{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
  .tiket .no{font-size:28px;font-weight:800;line-height:1.05;letter-spacing:-.02em}
  .tiket::before,.tiket::after{content:"";position:absolute;left:97px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:1px solid var(--line);z-index:1}
  .tiket::before{top:-11px}.tiket::after{bottom:-11px}
  .tiket .isi{flex:1;min-width:0;padding:13px 40px 13px 16px}
  .tiket .jenis{font-weight:700}
  .tiket .ket{margin:2px 0 6px;word-break:break-word}
  .salin1{position:absolute;right:8px;top:8px;border:0;background:var(--field);color:var(--mut);width:32px;height:32px;border-radius:10px;display:grid;place-items:center;cursor:pointer;transition:background .15s,color .15s}
  .salin1:hover{background:var(--okbg);color:var(--ok)}

  /* ---------- statistik & bar ---------- */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  @media (max-width:720px){.stats{grid-template-columns:1fr 1fr}}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
  .stat b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
  .stat span{font-size:12px;font-weight:600;color:var(--mut)}
  .stat.p b{color:var(--ok)}.stat.b b{color:var(--err)}.stat.s b{color:var(--pri)}
  .bar{height:9px;background:var(--bar);border-radius:99px;overflow:hidden;min-width:80px}
  .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pri),var(--pri2))}
  .bar.hot i{background:linear-gradient(90deg,#fb841f,#ef4444)}

  /* ---------- admin ---------- */
  .seg{display:inline-flex;gap:4px;padding:4px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);flex-wrap:wrap}
  .seg button{border:0;background:none;color:var(--mut);padding:8px 14px;border-radius:10px;font:600 13.5px var(--font);cursor:pointer}
  .seg button.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:var(--pri-ink)}
  .adm-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .adm-bar .gap{margin-left:auto}
  .login{max-width:440px;margin:8px auto}
  .login .ico{width:52px;height:52px;border-radius:16px;margin:0 auto 10px}
  .login h2{text-align:center}
  .login .sub{text-align:center}

  /* ---------- pencarian & kosong ---------- */
  .cari-box{position:relative;flex:1;min-width:220px}
  .cari-box svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--mut)}
  .cari-box input{padding-left:42px;height:46px}
  .kosong{text-align:center;padding:30px 12px;color:var(--mut)}
  .kosong svg{display:block;margin:0 auto 10px;color:color-mix(in srgb,var(--pri) 55%,var(--mut));opacity:.8}
  .kosong b{display:block;color:var(--ink);margin-bottom:2px}

  /* ---------- kalender ---------- */
  #kal{position:absolute;z-index:40;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:0 18px 40px -12px rgba(0,0,0,.35);width:300px;animation:masuk .18s ease both}
  #kal.hidden{display:none}
  .kal-head{display:flex;align-items:center;gap:2px;margin-bottom:8px}
  .kal-head b{flex:1;text-align:center;font-size:14.5px;font-weight:700}
  .kal-head button{border:0;background:none;color:var(--ink);cursor:pointer;font-size:17px;padding:5px 9px;border-radius:9px}
  .kal-head button:hover:not(:disabled){background:var(--okbg)}
  .kal-head button:disabled{opacity:.3;cursor:default}
  .kal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
  .kal-grid span{font-size:11px;font-weight:700;color:var(--mut);padding:5px 0}
  .kal-grid button{border:0;background:none;color:var(--ink);border-radius:10px;padding:8px 0;cursor:pointer;font:500 13px var(--font);transition:background .12s}
  .kal-grid button:hover:not(:disabled){background:var(--okbg)}
  .kal-grid button:disabled{color:var(--mut);opacity:.38;cursor:default}
  .kal-grid button.sel{background:linear-gradient(135deg,var(--pri),var(--pri2));color:var(--pri-ink);font-weight:700}
  .kal-grid button.today{box-shadow:inset 0 0 0 2px var(--accent)}
  .kal-grid button.libur{text-decoration:line-through;color:var(--err);opacity:.75}
  .kal-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--mut)}

  /* ---------- modal, toast, loading ---------- */
  .modal{position:fixed;inset:0;background:rgba(5,14,28,.6);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
  .modal.hidden{display:none}
  .modal .box{background:var(--card);border-radius:20px;padding:22px;width:100%;max-width:440px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);animation:pop .3s cubic-bezier(.3,1.3,.5,1) both}
  #toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#0e305d;color:#fff;border:1px solid rgba(251,132,31,.5);padding:10px 18px;border-radius:999px;
    font-size:13.5px;font-weight:600;box-shadow:0 14px 30px -10px rgba(0,0,0,.5);transition:opacity .25s,transform .25s;z-index:70}
  #toast.on{opacity:1;transform:translate(-50%,0)}
  .center{text-align:center;padding:40px 16px;color:var(--mut)}
  .skel{height:14px;border-radius:8px;margin:12px 0;background:linear-gradient(90deg,var(--field) 25%,color-mix(in srgb,var(--line) 70%,var(--field)) 50%,var(--field) 75%);background-size:200% 100%;animation:kilau 1.2s linear infinite}
  .skel.w40{width:40%;height:20px}.skel.w80{width:80%}
  @keyframes kilau{to{background-position:-200% 0}}
  .konfeti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
  .konfeti i{position:absolute;top:-14px;width:8px;height:14px;border-radius:2px;animation:jatuh 1.5s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes jatuh{to{transform:translate(var(--dx),105vh) rotate(var(--rot))}}

  /* ---------- layar sempit: menu jadi bilah bawah ---------- */
  @media (max-width:720px){
    .hero .wrap{padding:26px 16px 54px}
    .dock{position:fixed;left:0;right:0;bottom:0;margin:0;z-index:30}
    .dock .wrap{padding:0 10px calc(10px + env(safe-area-inset-bottom))}
    #tabs{border-radius:20px;box-shadow:0 -6px 30px -10px rgba(14,48,93,.35)}
    #tabs button{flex-direction:column;gap:3px;font-size:11px;padding:8px 4px}
    main{padding-bottom:110px}
    #toast{bottom:104px}
    .three,.two{grid-template-columns:1fr}
    .tiket .stub{width:92px}.tiket::before,.tiket::after{left:81px}
  }
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

function tgl(t) { // yyyy-MM-dd -> 5 Okt 2026
  if (!t) return '';
  const b = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  const p = String(t).slice(0, 10).split('-');
  return p.length === 3 ? (+p[2]) + ' ' + b[+p[1] - 1] + ' ' + p[0] : t;
}
const BLN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
const pad2 = n => String(n).padStart(2, '0');
function tglIn(t) { // yyyy-MM-dd -> 09 - Sep - 2026
  const p = String(t || '').split('-');
  return p.length === 3 ? pad2(+p[2]) + ' - ' + BLN[+p[1] - 1] + ' - ' + p[0] : 'Pilih tanggal';
}

// ---------- toast & konfeti ----------
let toastT = null;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1900); }
function konfeti() {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const w = document.createElement('div'); w.className = 'konfeti'; w.setAttribute('aria-hidden', 'true');
  const warna = ['#0e305d', '#fb841f', '#1b4a86', '#ffa24d', '#8fb4e8'];
  for (let i = 0; i < 28; i++) {
    const s = document.createElement('i');
    s.style.cssText = 'left:' + (Math.random() * 100) + '%;background:' + warna[i % warna.length] + ';animation-delay:' + (Math.random() * .25) + 's;--dx:' +
      (Math.random() * 180 - 90) + 'px;--rot:' + (Math.random() * 720 - 360) + 'deg';
    w.appendChild(s);
  }
  document.body.appendChild(w); setTimeout(() => w.remove(), 2000);
}

// ---------- kalender (format Indonesia, minggu mulai Senin) ----------
const kal = { i: -1, th: 0, bl: 0, jangkar: null };
function bukaKal(i, jangkar) {
  if (kal.i === i && !$('#kal').classList.contains('hidden')) return tutupKal();
  const p = state.rows[i].tanggal.split('-').map(Number);
  Object.assign(kal, { i: i, th: p[0], bl: p[1] - 1, jangkar: jangkar });
  gambarKal();
  const el = $('#kal'); el.classList.remove('hidden');
  const r = jangkar.getBoundingClientRect();
  const kiri = Math.max(8, Math.min(r.left + window.scrollX, window.innerWidth - el.offsetWidth - 8));
  el.style.left = kiri + 'px'; el.style.top = (r.bottom + window.scrollY + 6) + 'px';
}
function tutupKal() { $('#kal').classList.add('hidden'); kal.i = -1; }
function kalNav(d) {
  const maks = state.ctx.akhirBulan.split('-').map(Number), n = kal.th * 12 + kal.bl + d;
  if (n > maks[0] * 12 + maks[1] - 1) return;
  kal.th = Math.floor(n / 12); kal.bl = n % 12; gambarKal();
}
function kalPilih(t) { setRow(kal.i, 'tanggal', t); tutupKal(); gambarBaris(); }
function gambarKal() {
  const c = state.ctx, maks = c.akhirBulan.split('-').map(Number), pilih = state.rows[kal.i].tanggal;
  const nomorBulan = kal.th * 12 + kal.bl, bolehMaju = nomorBulan < maks[0] * 12 + maks[1] - 1, bolehMajuTahun = nomorBulan + 12 <= maks[0] * 12 + maks[1] - 1;
  const mulai = (new Date(Date.UTC(kal.th, kal.bl, 1)).getUTCDay() + 6) % 7;            // Senin = 0
  const jumlah = new Date(Date.UTC(kal.th, kal.bl + 1, 0)).getUTCDate();
  let sel = ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'].map(x => '<span>' + x + '</span>').join('') + '<i></i>'.repeat(mulai);
  for (let d = 1; d <= jumlah; d++) {
    const t = kal.th + '-' + pad2(kal.bl + 1) + '-' + pad2(d), dow = (mulai + d - 1) % 7;
    const libur = (c.libur || {})[t];
    const mati = t > c.akhirBulan || dow >= 5 || !!libur;                                // akhir pekan & hari libur tidak punya blok nomor
    sel += '<button' + (mati ? ' disabled' : ' onclick="kalPilih(\'' + t + '\')"') + (libur ? ' title="' + esc(libur) + '"' : '') +
      ' class="' + (t === pilih ? 'sel ' : '') + (t === c.hariIni ? 'today' : '') + (libur ? ' libur' : '') + '">' + d + '</button>';
  }
  $('#kal').innerHTML = '<div class="kal-head"><button onclick="kalNav(-12)" title="Tahun sebelumnya">«</button><button onclick="kalNav(-1)" title="Bulan sebelumnya">‹</button>' +
    '<b>' + BLN[kal.bl] + ' ' + kal.th + '</b><button onclick="kalNav(1)" title="Bulan berikutnya"' + (bolehMaju ? '' : ' disabled') + '>›</button>' +
    '<button onclick="kalNav(12)" title="Tahun berikutnya"' + (bolehMajuTahun ? '' : ' disabled') + '>»</button></div><div class="kal-grid">' + sel + '</div>' +
    '<div class="kal-foot"><span>Akhir pekan &amp; hari libur tidak tersedia</span><button class="btn sm" onclick="kalPilih(tanggalAwal())">' +
    (tanggalAwal() === c.hariIni ? 'Hari ini' : 'Hari kerja terakhir') + '</button></div>';
}
document.addEventListener('mousedown', e => { if (kal.i >= 0 && !e.target.closest('#kal') && !e.target.closest('.tglbtn')) tutupKal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && kal.i >= 0) tutupKal(); });

// ---------- NIP: dicek ke data pegawai, nama terisi otomatis ----------
let nipTimer = null, nipSeq = 0;
function inisial(nama) { // "Dr. MHD. Aftabuddin Rijaluzzaman, S.Pt." -> "AR"
  const kata = String(nama || '').split(/\s+/).map(k => k.replace(/[,]+$/, '')).filter(k => /^[A-Za-zÀ-ÿ]{2,}$/.test(k));
  const dua = (kata.length ? kata : String(nama || '?').split(/\s+/)).slice(0, 2);
  return dua.map(k => k.charAt(0).toUpperCase()).join('') || '?';
}
function onNip(v) {
  state.id.nip = v;
  const d = digits(v);
  clearTimeout(nipTimer); nipSeq++;
  if (d.length === 18) { state.nipStatus = { s: 'cek', nama: '', pesan: '' }; nipTimer = setTimeout(cekNip, 250); }
  else if (d.length > 18) state.nipStatus = { s: 'salah', nama: '', pesan: 'NIP lebih dari 18 digit.' };
  else state.nipStatus = { s: 'kosong', nama: '', pesan: d.length ? d.length + '/18 digit' : '' };
  tampilNip();
}
async function cekNip() {
  const seq = ++nipSeq;
  state.nipStatus = { s: 'cek', nama: '', pesan: '' }; tampilNip();
  try {
    const r = await call('api_cekNip', digits(state.id.nip));
    if (seq !== nipSeq) return;                        // sudah berubah lagi, abaikan hasil lama
    state.nipStatus = { s: 'ok', nama: r.nama, pesan: '' }; simpanId();
  } catch (e) {
    if (seq !== nipSeq) return;
    state.nipStatus = { s: 'salah', nama: '', pesan: pesan(e) };
  }
  tampilNip();
}
function tampilNip() {
  const st = state.nipStatus, n = $('#nama'), i = $('#nipInfo'), a = $('#avatar');
  if (n) { n.value = st.s === 'ok' ? st.nama : ''; n.title = n.value; }
  if (a) { a.textContent = st.s === 'ok' ? inisial(st.nama) : ''; a.classList.toggle('on', st.s === 'ok'); }
  if (i) i.innerHTML = st.s === 'ok' ? '<span class="chip ok">' + svg(IKON.ok, 14) + 'NIP terdaftar</span>'
    : st.s === 'cek' ? '<span class="chip cek">Memeriksa NIP…</span>'
    : st.s === 'salah' ? '<span class="chip err">' + esc(st.pesan) + '</span>' : esc(st.pesan);
  perbaruiTombol();
}
function perbaruiTombol() { const b = $('#kirim'); if (b) b.disabled = !(state.nipStatus.s === 'ok' && state.id.bidang); }
function setBidang(v) { state.id.bidang = v; if (state.nipStatus.s === 'ok') simpanId(); perbaruiTombol(); }

// ---------- modal ----------
function minta(judul, isi, withText) {

// ---------- Ambil nomor ----------
// Tanggal awal baris pertama: hari ini, atau hari kerja terakhir sebelumnya kalau hari ini akhir pekan/libur.
function tanggalAwal() {
  const c = state.ctx;
  let t = c.hariIni;
  for (let i = 0; i < 31; i++) {
    const p = t.split('-').map(Number), dt = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
    if ((dt.getUTCDay() + 6) % 7 < 5 && !(c.libur || {})[t]) return t;
    dt.setUTCDate(dt.getUTCDate() - 1); t = dt.toISOString().slice(0, 10);
  }
  return c.hariIni;
}
function barisBaru(dari) {
  const c = state.ctx;
  return { tanggal: dari ? dari.tanggal : tanggalAwal(), pilih: dari ? dari.pilih : 'J|' + (c.ref.jenis[0] || ''), jumlah: 1, keperluan: '' };
}
function opsiJenis(pilih) {
  const r = state.ctx.ref;
  const j = r.jenis.map(x => '<option value="J|' + esc(x) + '"' + (pilih === 'J|' + x ? ' selected' : '') + '>' + esc(x) + '</option>').join('');
  const p = r.paket.map(x => '<option value="P|' + esc(x.nama) + '"' + (pilih === 'P|' + x.nama ? ' selected' : '') + '>' + esc(x.nama) + ' (' + esc(x.isi.join(' + ')) + ')</option>').join('');
  return '<optgroup label="Jenis dokumen">' + j + '</optgroup>' + (p ? '<optgroup label="Paket (beberapa nomor sekaligus)">' + p + '</optgroup>' : '');
}
function opsiBidang(pilih) {
  return '<option value="">— pilih —</option>' + state.ctx.ref.bidang.map(b => '<option' + (b === pilih ? ' selected' : '') + '>' + esc(b) + '</option>').join('');
}
function rAmbil() {

    '<div class="three"><div><label for="nip">NIP</label><input id="nip" inputmode="numeric" autocomplete="off" maxlength="30" placeholder="18 digit NIP" value="' + esc(state.id.nip) + '" oninput="onNip(this.value)"></div>' +
    '<div><label for="nama">Nama (terisi otomatis)</label><div class="namawrap"><span class="avatar" id="avatar" aria-hidden="true"></span><input id="nama" readonly tabindex="-1" placeholder="Muncul setelah NIP benar"></div></div>' +
    '<div><label for="bidang">Bidang / divisi</label><select id="bidang" onchange="setBidang(this.value)">' + opsiBidang(state.id.bidang) + '</select></div></div>' +
    '<div id="nipInfo"></div>' +
    '<p class="mut" style="margin:2px 0 0">NIP dicek ke data pegawai. NIP yang salah atau tidak terdaftar tidak dapat mengambil nomor surat.</p>' +
    '<input class="hp" id="web" tabindex="-1" autocomplete="off" aria-hidden="true"></div>' +
    '<div class="card"><div class="card-h"><span class="step">2</span><div><h2>Ambil nomor surat</h2><p class="hint">Tanggal mundur boleh kapan saja, ke depan sampai ' + tgl(c.akhirBulan) + '. Maksimal ' + c.batas.perKirim + ' nomor per pengiriman dan ' + c.batas.perHari + ' nomor per hari per NIP.</p></div></div>' +
    err(state.err) + '<div id="rows"></div>' +
    '<div class="actions"><button class="btn" onclick="tambahBaris()"><span aria-hidden="true">+</span> Tambah baris</button>' +
    '<button class="btn pri" id="kirim" onclick="kirim()">Ambil nomor</button></div></div>';

function gambarBaris() {
  const c = state.ctx;
  if (kal.i >= 0) tutupKal();
  const kepala = '<div class="row head" role="row"><div class="h-tgl">Tanggal dokumen</div><div>Jenis dokumen / paket</div><div>Jumlah</div><div>Keperluan</div><div></div></div>';
  $('#rows').innerHTML = kepala + state.rows.map((r, i) => {
    const paket = r.pilih.indexOf('P|') === 0;

    return '<div class="row' + (lanjut ? ' lanjut' : '') + '">' +
      '<div><label class="lbl">Tanggal dokumen</label><div class="tglwrap">' +
      '<button class="plus" title="Tambah baris di bawah ini dengan tanggal yang sama" aria-label="Tambah baris dengan tanggal yang sama" onclick="tambahDiTanggal(' + i + ')">+</button>' +
      '<button class="tglbtn" aria-label="Pilih tanggal dokumen" onclick="bukaKal(' + i + ',this)"><span>' + esc(tglIn(r.tanggal)) + '</span>' + IKON_KAL + '</button></div></div>' +
      '<div><label class="lbl">Jenis dokumen / paket</label><select aria-label="Jenis dokumen / paket" onchange="setRow(' + i + ',\'pilih\',this.value);gambarBaris()">' + opsiJenis(r.pilih) + '</select></div>' +

      '<div class="wide"><label class="lbl">Keperluan</label><input type="text" aria-label="Keperluan" maxlength="300" placeholder="mis. SPJ mamin rapat koordinasi" value="' + esc(r.keperluan) + '" oninput="setRow(' + i + ',\'keperluan\',this.value)"></div>' +
      '<div><button class="ghost" title="Hapus baris" aria-label="Hapus baris" onclick="hapusBaris(' + i + ')">×</button></div></div>';

function setRow(i, k, v) { state.rows[i][k] = v; }
// Tambah baris tepat di bawah baris i dengan tanggal (dan jenis) yang sama, fokus ke kolom keperluan.
function tambahDiTanggal(i) {
  state.rows.splice(i + 1, 0, barisBaru(state.rows[i]));

  const el = document.querySelectorAll('#rows .row')[i + 1];
  if (el) el.querySelector('input[type=text]').focus();
}
function tambahBaris() { state.rows.push(barisBaru(state.rows[state.rows.length - 1])); gambarBaris(); }
function hapusBaris(i) { state.rows.splice(i, 1); if (!state.rows.length) state.rows.push(barisBaru()); gambarBaris(); }
async function kirim() {

    : { tanggal: r.tanggal, jenis: r.pilih.slice(2), jumlah: r.jumlah, keperluan: r.keperluan });
  if (state.nipStatus.s !== 'ok') { state.err = 'Isi NIP yang terdaftar terlebih dahulu.'; rAmbil(); return; }
  $('#kirim').disabled = true; $('#kirim').textContent = 'Memproses…';
  try {
    const r = await call('api_ambil', { nip: digits(state.id.nip), bidang: state.id.bidang, web: ($('#web') || {}).value || '', items });
    state.hasil = r.hasil; state.rows = [barisBaru()]; state.err = '';
    rHasil(); konfeti();
  } catch (e) { state.err = pesan(e); rAmbil(); }
}

    '<div><h2>Berhasil! ' + h.length + ' nomor surat siap dipakai</h2><p class="mut">Salin nomornya, lalu cantumkan di surat Anda.</p></div></div>' +

    '<div class="hasil">' + h.map((x, i) => '<div class="tiket" style="animation-delay:' + Math.min(i, 8) * 0.05 + 's"><div class="stub"><small>No.</small><div class="no">' + esc(x.nomor) + '</div></div>' +

      (x.geser ? '<div style="margin-top:6px"><span class="badge warn">digeser · blok ' + tgl(x.tanggalBlok) + '</span></div>' : '') + '</div>' +
      '<button class="salin1" title="Salin nomor ' + esc(x.nomor) + '" aria-label="Salin nomor ' + esc(x.nomor) + '" onclick="salinSatu(' + i + ')">' + svg(IKON.salin, 16) + '</button></div>').join('') + '</div>' +
    '<div class="actions" style="margin-top:18px"><button class="btn pri" onclick="salin()">' + svg(IKON.salin, 16) + 'Salin semua</button>' +

function salinTeks(t, pesanOk) {
  const ok = () => toast(pesanOk);

  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, cadangan); else cadangan();
}
function salin() { salinTeks(state.hasil.map(x => x.nomor + '\t' + x.jenis + '\t' + x.keperluan + '\t' + x.tanggalDok).join('\n'), state.hasil.length + ' nomor tersalin'); }

// ---------- Nomor saya (berdasarkan NIP) ----------

  $('#app').innerHTML = skel();
  try {
    const d = await call('api_nomorSaya', digits(k));
    $('#app').innerHTML = '<div class="card">' + kepala + form + err(state.err) +
      (d.length ? '<div class="tbl"><table><tr><th>Nomor</th><th>Tgl dokumen</th><th>Jenis</th><th>Keperluan</th><th>Status</th><th></th></tr>' +
        d.map(x => '<tr><td><b>' + x.nomor + '</b></td><td>' + tgl(x.tanggalDok) + '</td><td>' + esc(x.jenis) + '</td><td>' + esc(x.keperluan) +
          (x.geser ? '<div class="mut">' + esc(x.geser) + '</div>' : '') + (x.keteranganBatal ? '<div class="mut">' + esc(x.keteranganBatal) + '</div>' : '') + '</td>' +
          '<td><span class="pill st-' + esc(x.status) + '">' + esc(x.status) + '</span>' + (x.menungguBatal ? '<div class="mut">menunggu batal</div>' : '') + '</td>' +
          '<td>' + (x.status === 'Terpakai' && !x.menungguBatal ? '<button class="btn sm" onclick="ajukanBatal(' + x.nomor + ')">Ajukan batal</button>' : '') + '</td></tr>').join('') +
        '</table></div>' : kosong('Belum ada nomor', 'untuk NIP ini.')) + '</div>';
  } catch (e) { state.err = pesan(e); state.sayaNip = ''; $('#app').innerHTML = '<div class="card">' + kepala + form + err(state.err) + '</div>'; state.err = ''; }
}
function cekSaya() { state.sayaNip = $('#sk').value; state.err = ''; rSaya(); }
async function ajukanBatal(no) {
  const alasan = await minta('Ajukan pembatalan nomor ' + no, '<span class="mut">Admin akan memutuskan. Nomor yang batal tidak dipakai ulang.</span>', true);
  if (!alasan) return;
  try { await call('api_ajukanBatal', no, digits(state.sayaNip || state.id.nip), alasan); state.err = ''; toast('Pengajuan batal terkirim'); } catch (e) { state.err = pesan(e); }
  rSaya();
}

// ---------- Cari ----------
function rCari() {
  $('#app').innerHTML = '<div class="card"><div class="card-h"><span class="ico">' + svg(IKON.cari, 18) + '</span><div><h2>Cari nomor</h2><p class="hint">Cari berdasarkan nomor, keperluan, bidang, atau nama pemohon.</p></div></div>' +
    '<div class="actions" style="margin:0 0 14px"><div class="cari-box">' + svg(IKON.cari, 18) + '<input id="q" placeholder="mis. 101, SPJ mamin, Bidang Energi" onkeydown="if(event.key===\'Enter\')cari()"></div>' +
    '<button class="btn pri" onclick="cari()">Cari</button></div><div id="hs"></div></div>';
}
async function cari() {
  const q = $('#q').value; $('#hs').innerHTML = '<div class="skel"></div><div class="skel w80"></div>';
  try {
    const d = await call('api_cari', q);
    $('#hs').innerHTML = d.length ? '<div class="tbl"><table><tr><th>Nomor</th><th>Tgl dokumen</th><th>Bidang</th><th>Jenis</th><th>Keperluan</th><th>Pemohon</th><th>Status</th></tr>' +
      d.map(x => '<tr><td><b>' + x.nomor + '</b></td><td>' + tgl(x.tanggalDok) + '</td><td>' + esc(x.bidang) + '</td><td>' + esc(x.jenis) + '</td><td>' + esc(x.keperluan) +
        (x.geser ? '<div class="mut">' + esc(x.geser) + '</div>' : '') + '</td><td>' + esc(x.pemohon) + '</td><td><span class="pill st-' + esc(x.status) + '">' + esc(x.status) + '</span></td></tr>').join('') +
      '</table></div>' : kosong('Tidak ada hasil', 'Coba kata kunci lain.');
  } catch (e) { $('#hs').innerHTML = err(pesan(e)); }
}

// ---------- Admin (masuk dengan kode) ----------
const setAdm = html => { const el = $('#adm'); if (el) el.innerHTML = html; };
async function adminCall(fn, ...args) {
  try { return await call(fn, state.token, ...args); }
  catch (e) { if (pesan(e).indexOf('SESI_ADMIN') === 0) { state.token = null; state.err = 'Sesi admin habis, silakan masuk lagi.'; rAdmin(); } throw e; }
}
function rAdmin() {
  if (!state.token) {
    $('#app').innerHTML = '<div class="card login"><span class="ico">' + svg(IKON.kunci, 24) + '</span><h2>Masuk admin</h2><p class="mut sub">Khusus pengelola nomor surat.</p>' + err(state.err) +
      '<label for="aNama">Username</label><input id="aNama" maxlength="60" autocomplete="username" autocapitalize="off" value="' + esc(state.adminNama) + '"><label for="aKode" style="margin-top:10px">Password</label>' +
      '<input id="aKode" type="password" autocomplete="current-password" onkeydown="if(event.key===\'Enter\')masukAdmin()"><div class="actions" style="margin-top:14px"><button class="btn pri" style="width:100%" onclick="masukAdmin()">Masuk</button></div></div>';
    return;
  }
  const m = [['dasbor', 'Dasbor'], ['blok', 'Atur blok'], ['kelola', 'Batal & alih']];
  $('#app').innerHTML = '<div class="adm-bar"><div class="seg">' + m.map(([k, l]) => '<button class="' + (state.adminMenu === k ? 'on' : '') + '" onclick="state.adminMenu=\'' + k + '\';rAdmin()">' + l + '</button>').join('') + '</div>' +
    '<span class="mut gap">Admin: <b>' + esc(state.adminNama) + '</b></span><button class="btn sm" onclick="state.token=null;rAdmin()">Keluar</button></div><div id="adm"></div>';
  ({ dasbor: rDasbor, blok: rBlok, kelola: rKelola })[state.adminMenu]();
}
async function masukAdmin() {
  state.adminNama = $('#aNama').value;
  try { const r = await call('api_adminLogin', $('#aKode').value, state.adminNama); state.token = r.token; state.adminNama = r.nama; state.err = ''; }
  catch (e) { state.err = pesan(e); }
  rAdmin();
}

async function rDasbor(bulan) {
  const c = state.ctx, bl = c.konfig.map(k => k.bulan);
  bulan = bulan || (bl.indexOf(c.bulanIni) >= 0 ? c.bulanIni : bl[bl.length - 1]);
  if (!bulan) { setAdm('<div class="card">' + kosong('Belum ada bulan yang diatur', 'Atur ukuran blok di menu "Atur blok".') + '</div>'); return; }
  setAdm(skel());
  try {
    const d = await adminCall('api_adminDashboard', bulan);
    const k = c.konfig.find(x => x.bulan === bulan) || {};
    const tot = d.reduce((a, x) => ({ t: a.t + x.total, p: a.p + x.terpakai, b: a.b + x.batal }), { t: 0, p: 0, b: 0 });
    setAdm('<div class="stats"><div class="stat"><span>Total nomor</span><b>' + tot.t + '</b></div><div class="stat p"><span>Terpakai</span><b>' + tot.p + '</b></div>' +
      '<div class="stat b"><span>Batal</span><b>' + tot.b + '</b></div><div class="stat s"><span>Sisa</span><b>' + (tot.t - tot.p - tot.b) + '</b></div></div>' +
      '<div class="card"><div class="card-h"><div><h2>Pemakaian per hari</h2><p class="hint">Blok ' + (k.ukuran || '-') + ' nomor/hari · nomor ' + (k.awal || '-') + '–' + (k.akhir || '-') + '</p></div></div>' +
      '<div class="actions" style="margin:0 0 12px"><select style="width:auto" onchange="rDasbor(this.value)">' + bl.map(b => '<option' + (b === bulan ? ' selected' : '') + '>' + b + '</option>').join('') + '</select></div>' +
      '<div class="tbl"><table><tr><th>Tanggal blok</th><th>Terpakai</th><th>Batal</th><th>Sisa</th><th style="width:30%">Pemakaian</th></tr>' +
      d.map(x => { const pct = Math.round((x.terpakai + x.batal) * 100 / x.total);
        return '<tr><td>' + tgl(x.tanggal) + '</td><td>' + x.terpakai + '</td><td>' + x.batal + '</td><td>' + (x.total - x.terpakai - x.batal) + '</td>' +
          '<td><div class="bar ' + (pct >= 80 ? 'hot' : '') + '"><i style="width:' + pct + '%"></i></div><span class="mut">' + pct + '%' + (pct >= 80 ? ' · hampir penuh' : '') + '</span></td></tr>'; }).join('') +
      '</table></div></div>');
  } catch (e) { setAdm('<div class="card">' + err(pesan(e)) + '</div>'); }
}

function rBlok() {
  const c = state.ctx;
  setAdm('<div class="card"><div class="card-h"><div><h2>Atur ukuran blok bulanan</h2><p class="hint">Nomor per hari kerja hanya bisa diatur pada tanggal 1 bulan yang bersangkutan, dan terkunci setelah disimpan. Hari libur diambil dari tab HariLibur.' +
    (c.modeUji ? ' <b>Mode uji aktif: aturan "hanya tanggal 1" dilonggarkan.</b>' : '') + '</p></div></div>' + err(state.err) +
    '<div class="two"><div><label>Bulan</label><input type="month" id="bBulan" value="' + c.bulanIni + '"></div>' +
    '<div><label>Nomor per hari kerja</label><input type="number" id="bUkuran" min="1" max="1000" value="50"></div></div>' +
    '<div class="actions"><button class="btn pri" onclick="simpanBlok()">Simpan (terkunci)</button></div></div>' +
    '<div class="card"><div class="card-h"><div><h2>Bulan yang sudah diatur</h2></div></div>' + (c.konfig.length ? '<div class="tbl"><table><tr><th>Bulan</th><th>Nomor/hari</th><th>Rentang nomor</th></tr>' +
      c.konfig.map(k => '<tr><td>' + k.bulan + '</td><td>' + k.ukuran + '</td><td>' + k.awal + '–' + k.akhir + '</td></tr>').join('') + '</table></div>' : kosong('Belum ada', '')) + '</div>');
}
async function simpanBlok() {
  const b = $('#bBulan').value, u = $('#bUkuran').value;
  const ya = await minta('Simpan ukuran blok?', 'Bulan <b>' + esc(b) + '</b>, <b>' + esc(u) + '</b> nomor per hari kerja. Setelah disimpan tidak bisa diubah.', false);
  if (!ya) return;
  try { await adminCall('api_adminSetBlok', b, u); Object.assign(state.ctx, await call('api_konteks')); state.err = ''; toast('Ukuran blok tersimpan'); } catch (e) { state.err = pesan(e); }
  if (state.token) rBlok();
}

async function rKelola() {
  setAdm(skel());
  let q = [], e1 = '';
  try { q = await adminCall('api_adminPermintaanBatal'); } catch (e) { e1 = pesan(e); }
  if (!state.token) return;
  setAdm('<div class="card"><div class="card-h"><div><h2>Pengajuan pembatalan</h2></div></div>' + err(e1 || state.err) +
    (q.length ? '<div class="tbl"><table><tr><th>Nomor</th><th>Pemohon</th><th>Dokumen</th><th>Alasan</th><th></th></tr>' +
      q.map(x => '<tr><td><b>' + x.nomor + '</b></td><td>' + esc(x.pemohon) + '</td><td>' + esc(x.jenis) + '<div class="mut">' + esc(x.keperluan) + '</div></td><td>' + esc(x.alasan) + '</td>' +
        '<td style="white-space:nowrap"><button class="btn sm pri" onclick="putus(' + x.id + ',true)">Setujui</button> <button class="btn sm" onclick="putus(' + x.id + ',false)">Tolak</button></td></tr>').join('') +
      '</table></div>' : kosong('Tidak ada pengajuan', 'yang menunggu keputusan.')) + '</div>' +
    '<div class="two"><div class="card"><div class="card-h"><div><h2>Batalkan nomor</h2></div></div><label>Nomor</label><input id="kbNo" type="number"><label style="margin-top:10px">Alasan</label><input id="kbAl">' +
    '<div class="actions"><button class="btn" onclick="batalLangsung()">Batalkan</button></div><p class="mut" style="margin:10px 0 0">Dicatat "Batal", tidak dipakai ulang.</p></div>' +
    '<div class="card"><div class="card-h"><div><h2>Alihkan nomor</h2></div></div><label>Nomor</label><input id="kaNo" type="number">' +
    '<label style="margin-top:10px">NIP penerima (terdaftar)</label><input id="kaNip" inputmode="numeric"><label style="margin-top:10px">Bidang penerima</label><select id="kaBid">' + opsiBidang('') + '</select>' +
    '<label style="margin-top:10px">Alasan</label><input id="kaAl">' +
    '<div class="actions"><button class="btn" onclick="alihkan()">Alihkan</button></div></div></div>');
  state.err = '';
}
async function putus(id, setuju) { try { await adminCall('api_adminPutusBatal', id, setuju); state.err = ''; toast(setuju ? 'Pembatalan disetujui' : 'Pengajuan ditolak'); } catch (e) { state.err = pesan(e); } if (state.token) rKelola(); }
async function batalLangsung() {
  try { await adminCall('api_adminBatal', +$('#kbNo').value, $('#kbAl').value); state.err = ''; toast('Nomor dibatalkan'); } catch (e) { state.err = pesan(e); } if (state.token) rKelola();
}
async function alihkan() {
  try { await adminCall('api_adminAlihkan', +$('#kaNo').value, digits($('#kaNip').value), $('#kaBid').value, $('#kaAl').value); state.err = ''; toast('Nomor dialihkan'); } catch (e) { state.err = pesan(e); }
  if (state.token) rKelola();
}
</script>
</body>
</html>
